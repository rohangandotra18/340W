# Ablation: standard loss only (no SPO+)
# Compare against SPO+ model to measure decision-focused learning impact

data:
  data_path: /path/to/metr-la.npz
  adj_path: /path/to/adj_metr_la.npz
  in_channels: 3
  in_horizon: 12
  out_horizon: 12

model:
  d_model: 64
  n_temporal_layers: 2
  n_spatial_layers: 2
  n_heads: 8
  d_state: 16
  n_classes: 3
  dropout: 0.1

training:
  epochs: 150
  batch_size: 64
  lr: 1.0e-3
  weight_decay: 1.0e-4
  lambda1: 1.0
  lambda2: 0.1
  ffs: 65.0
  num_workers: 4
  output_dir: ./checkpoints/ablation_no_spo

spo:
  use_spo: false
